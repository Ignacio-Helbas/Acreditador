<!doctype html>
<html lang="es">

    <title>Acreditador de Eventos</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <!-- Detección amigable si se abre como file:// en vez de http:// -->
    <script>
      if (window.location.protocol === 'file:') {
        document.addEventListener('DOMContentLoaded', function() {
          document.body.innerHTML = `
            <div style="font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f8fafc; margin: 0; padding: 20px;">
              <div style="background: white; border: 1px solid #e2e8f0; border-radius: 20px; padding: 36px; max-width: 520px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.08); text-align: center;">
                <div style="font-size: 54px; margin-bottom: 12px;">🎫</div>
                <h2 style="color: #0f172a; margin: 0 0 10px; font-size: 22px; font-weight: 800;">¿Por qué sale la página en blanco?</h2>
                <p style="color: #475569; font-size: 14px; line-height: 1.6; margin: 0 0 20px;">
                  Las aplicaciones modernas de React no pueden ejecutarse abriendo el archivo <code>index.html</code> directamente con doble clic (protocolo <code>file://</code>) porque el navegador bloquea los módulos de JavaScript por seguridad.
                </p>
                <div style="background: #f0fdf4; border: 1.5px solid #86efac; border-radius: 14px; padding: 18px; text-align: left; margin-bottom: 24px;">
                  <p style="margin: 0 0 8px; font-weight: 700; color: #166534; font-size: 14px;">👉 Cómo abrir la aplicación correctamente:</p>
                  <ol style="margin: 0; padding-left: 20px; color: #15803d; font-size: 13px; line-height: 1.6;">
                    <li>Andá a la carpeta de tu proyecto.</li>
                    <li>Hacé doble clic en el archivo <b>iniciar.bat</b>.</li>
                    <li>¡Listo! Se abrirá automáticamente en tu navegador en <b>http://localhost:3001</b>.</li>
                  </ol>
                </div>
                <a href="http://localhost:3001" style="display: inline-block; background: #16a34a; color: white; padding: 12px 28px; border-radius: 12px; text-decoration: none; font-weight: 700; font-size: 14px; box-shadow: 0 4px 6px -1px rgba(22, 163, 74, 0.3);">
                  Ir a http://localhost:3001
                </a>
              </div>
            </div>
          `;
        });
      }
    </script>
    <script type="module" crossorigin src="/assets/index-m-eqeBjc.js"></script>
